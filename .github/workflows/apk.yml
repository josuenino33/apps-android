# Monta os 5 APKs assinados e publica numa versão (Release) para download.
# Para gerar uma versão nova: aba Actions > "Gerar APKs" > Run workflow, e informe o número.
name: Gerar APKs

on:
  workflow_dispatch:
    inputs:
      versao:
        description: 'Número da versão (ex.: 1.0.1)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Preparar a chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/apps-android.p12"

      - name: Montar os APKs
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/apps-android.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: apps
          VERSION_NAME: ${{ inputs.versao }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Conferir assinatura e renomear
        run: |
          mkdir -p saida
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for app in bateria guitarra treino canto teclado ingles; do
            apk="app/build/outputs/apk/$app/release/app-$app-release.apk"
            "$APKSIGNER" verify --print-certs "$apk" | grep -i "SHA-256"
            case $app in
              bateria)  nome=bateria-do-zero-ao-pro ;;
              guitarra) nome=guitarra-do-zero-ao-pro ;;
              treino)   nome=treino-em-casa-do-zero ;;
              canto)    nome=canto-do-zero-ao-pro ;;
              teclado)  nome=teclado-do-zero-ao-pro ;;
              ingles)   nome=ingles-do-zero-ao-pro ;;
            esac
            cp "$apk" "saida/$nome.apk"
          done
          ls -la saida

      - name: Publicar a versão
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ inputs.versao }}
        run: |
          cat > notas.md <<'EOF'
          ## Como instalar no Android

          1. No celular, toque no APK do app que você quer (abaixo, em **Assets**).
          2. Quando o Android pedir, permita instalar apps desta fonte (é pedido uma vez só).
          3. Toque em **Instalar** e depois em **Abrir**.

          | App | Arquivo |
          |---|---|
          | 🥁 Bateria do zero ao pro | `bateria-do-zero-ao-pro.apk` |
          | 🎸 Guitarra do zero ao pro | `guitarra-do-zero-ao-pro.apk` |
          | 💪 Treino em casa do zero | `treino-em-casa-do-zero.apk` |
          | 🎤 Canto do zero ao pro | `canto-do-zero-ao-pro.apk` |
          | 🎹 Teclado do zero ao pro | `teclado-do-zero-ao-pro.apk` |
          | 🗣️ Inglês do zero ao pro | `ingles-do-zero-ao-pro.apk` |

          Os apps abrem em tela cheia e se atualizam sozinhos quando o site muda.
          EOF
          sed -i 's/^          //' notas.md
          gh release create "v$VERSAO" saida/*.apk --title "Apps Android $VERSAO" --notes-file notas.md --latest
